publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  go_router: ^14.2.0
  fl_chart: ^0.69.0
  shared_preferences: ^2.3.2
  http: ^1.2.2
  pdf: ^3.11.1
