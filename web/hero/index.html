<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRISM hero</title>
<!--
  PRISM Engine landing hero. Embedded in the Flutter web app as an iframe (see lib/widgets/hero_scene_web.dart).
  A glass triangular prism refracts a giant headline with chromatic dispersion.
  Everything is local (three.js r169 + Space Grotesk in ./vendor and ./fonts), so it works offline.
  Query params: ?still=1 disables idle motion.
-->
<style>
  @font-face {
    font-family: 'Space Grotesk';
    font-weight: 700;
    font-style: normal;
    font-display: swap;
    src: url('fonts/space-grotesk-latin-700-normal.woff2') format('woff2');
  }
  :root { --bg: #0B1020; --ink: #E8EBF5; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: 'Space Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; outline: none; }
  #scene.dragging { cursor: grabbing; }
  #scene:focus-visible { box-shadow: inset 0 0 0 2px #7B61F0; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .hint { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); font-size: 12px; letter-spacing: .04em;
    color: rgba(232, 235, 245, .55); pointer-events: none; transition: opacity .6s; white-space: nowrap; }
  .hint.gone { opacity: 0; }
  .loader { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 13px; opacity: .6; transition: opacity .6s; pointer-events: none; }
  .loader.done { opacity: 0; }
  /* Shown only if WebGL or three.js is unavailable. */
  .fallback { display: none; position: absolute; inset: 0; place-items: center; text-align: center; }
  .fallback h1 { font-size: clamp(56px, 13vw, 180px); line-height: 1.02; letter-spacing: -0.03em; font-weight: 700; color: var(--ink); }
  body.no-webgl .fallback { display: grid; }
  body.no-webgl #scene, body.no-webgl .hint, body.no-webgl .loader { display: none; }
</style>
<script type="importmap">
  { "imports": {
      "three": "./vendor/three.module.min.js",
      "three/addons/utils/BufferGeometryUtils.js": "./vendor/BufferGeometryUtils.js"
  } }
</script>
</head>
<body>
  <h1 class="sr-only">Choose your future</h1>
  <canvas id="scene" tabindex="0" aria-label="Glass prism refracting the words Choose Your Future. Drag, or use the left and right arrow keys, to rotate."></canvas>
  <div class="loader" id="loader">Loading 3D</div>
  <div class="hint" id="hint">Drag the prism</div>
  <div class="fallback"><h1>Choose<br>Your<br>Future</h1></div>

<script type="module">
const params = new URLSearchParams(location.search);
const still = params.get('still') === '1' || matchMedia('(prefers-reduced-motion: reduce)').matches;
const BG = '#0B1020';
const INK = '#E8EBF5';
const LINES = ['Choose', 'Your', 'Future'];

// Forward wheel scrolling to the Flutter page, so the page still scrolls when the mouse is over the hero.
const tellParent = (dy) => { try { parent.postMessage('prism-wheel:' + dy, '*'); } catch (_) {} };
addEventListener('wheel', (e) => tellParent(e.deltaY), { passive: true });

function fail(err) {
  console.warn('PRISM hero fallback:', err);
  document.body.classList.add('no-webgl');
}

let THREE, BGU;
try {
  THREE = await import('three');
  BGU = await import('three/addons/utils/BufferGeometryUtils.js');
  const test = document.createElement('canvas');
  if (!(test.getContext('webgl2') || test.getContext('webgl'))) throw new Error('WebGL unavailable');
} catch (err) {
  fail(err);
}
if (THREE) start();

function start() {
  const canvas = document.getElementById('scene');
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  } catch (err) { fail(err); return; }
  renderer.setClearColor(BG, 1);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
  camera.position.set(0, 0, 10);
  camera.lookAt(0, 0, 0);

  // ---------- Background headline drawn into a 2D canvas so the glass can refract it ----------
  const textCanvas = document.createElement('canvas');
  const ctx = textCanvas.getContext('2d');
  const textTex = new THREE.CanvasTexture(textCanvas);
  textTex.colorSpace = THREE.SRGBColorSpace;
  textTex.minFilter = THREE.LinearFilter;
  textTex.magFilter = THREE.LinearFilter;
  textTex.generateMipmaps = false;

  const bgScene = new THREE.Scene();
  const bgQuad = new THREE.Mesh(
    new THREE.PlaneGeometry(2, 2),
    new THREE.ShaderMaterial({
      uniforms: { uTex: { value: textTex } },
      vertexShader: `
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
      fragmentShader: `
        uniform sampler2D uTex;
        varying vec2 vUv;
        void main() {
          gl_FragColor = texture2D(uTex, vUv);
          #include <colorspace_fragment>
        }`,
      depthTest: false,
      depthWrite: false,
    })
  );
  bgQuad.frustumCulled = false;
  bgScene.add(bgQuad);

  // ---------- Glass material: screen-space refraction with 6-band chromatic dispersion ----------
  const vertexShader = `
    varying vec3 vNormal;
    varying vec3 vEye;
    void main() {
      vec4 worldPos = modelMatrix * vec4(position, 1.0);
      vec4 mvPos = viewMatrix * worldPos;
      gl_Position = projectionMatrix * mvPos;
      vNormal = normalize(normalMatrix * normal);
      vEye = normalize(mvPos.xyz);
    }`;

  const fragmentShader = `
    uniform sampler2D uTexture;
    uniform vec2 uResolution;
    uniform float uIorR, uIorY, uIorG, uIorC, uIorB, uIorP;
    uniform float uRefractPower, uChromatic, uSaturation;
    uniform float uShininess, uDiffuseness, uFresnelPower;
    uniform vec3 uLight;
    uniform float uBackside;
    varying vec3 vNormal;
    varying vec3 vEye;

    const int LOOP = 16;

    vec3 sat(vec3 rgb, float adj) {
      const vec3 W = vec3(0.2125, 0.7154, 0.0721);
      vec3 intensity = vec3(dot(rgb, W));
      return mix(intensity, rgb, adj);
    }

    float specular(vec3 light, float shininess, float diffuseness, vec3 n, vec3 eye) {
      vec3 lightVector = normalize(-light);
      vec3 halfVector = normalize(-eye + lightVector);
      float NdotL = dot(n, lightVector);
      float NdotH = max(dot(n, halfVector), 0.0);
      float kSpecular = pow(NdotH, shininess);
      float kDiffuse = max(0.0, NdotL);
      return kSpecular + kDiffuse * diffuseness;
    }

    void main() {
      vec2 uv = gl_FragCoord.xy / uResolution;
      vec3 n = normalize(vNormal);
      if (uBackside > 0.5) n = -n;
      vec3 eye = normalize(vEye);
      vec3 color = vec3(0.0);

      for (int i = 0; i < LOOP; i++) {
        float slide = float(i) / float(LOOP) * 0.045;

        vec3 refR = refract(eye, n, 1.0 / uIorR);
        vec3 refY = refract(eye, n, 1.0 / uIorY);
        vec3 refG = refract(eye, n, 1.0 / uIorG);
        vec3 refC = refract(eye, n, 1.0 / uIorC);
        vec3 refB = refract(eye, n, 1.0 / uIorB);
        vec3 refP = refract(eye, n, 1.0 / uIorP);

        vec3 tR = texture2D(uTexture, uv + refR.xy * (uRefractPower + slide * 1.0) * uChromatic).rgb;
        vec3 tY = texture2D(uTexture, uv + refY.xy * (uRefractPower + slide * 1.0) * uChromatic).rgb;
        vec3 tG = texture2D(uTexture, uv + refG.xy * (uRefractPower + slide * 2.0) * uChromatic).rgb;
        vec3 tC = texture2D(uTexture, uv + refC.xy * (uRefractPower + slide * 2.5) * uChromatic).rgb;
        vec3 tB = texture2D(uTexture, uv + refB.xy * (uRefractPower + slide * 3.0) * uChromatic).rgb;
        vec3 tP = texture2D(uTexture, uv + refP.xy * (uRefractPower + slide * 1.0) * uChromatic).rgb;

        float r = tR.x * 0.5;
        float y = (tY.x * 2.0 + tY.y * 2.0 - tY.z) / 6.0;
        float g = tG.y * 0.5;
        float c = (tC.y * 2.0 + tC.z * 2.0 - tC.x) / 6.0;
        float b = tB.z * 0.5;
        float p = (tP.z * 2.0 + tP.x * 2.0 - tP.y) / 6.0;

        float R = r + (2.0 * p + 2.0 * y - c) / 3.0;
        float G = g + (2.0 * y + 2.0 * c - p) / 3.0;
        float B = b + (2.0 * c + 2.0 * p - y) / 3.0;
        color += vec3(R, G, B);
      }
      color /= float(LOOP);
      color = sat(color, uSaturation);

      float spec = specular(uLight, uShininess, uDiffuseness, n, eye)
                 + 0.6 * specular(vec3(1.0, 1.0, -1.0), uShininess * 0.6, uDiffuseness * 0.5, n, eye);
      color += spec * (uBackside > 0.5 ? 0.35 : 1.0);

      float f = pow(1.0 + dot(eye, n), uFresnelPower);
      color = mix(color, vec3(1.0), f * (uBackside > 0.5 ? 0.25 : 0.55));

      color += vec3(0.004, 0.005, 0.007);
      gl_FragColor = vec4(color, 1.0);
      #include <colorspace_fragment>
    }`;

  function glass(backside) {
    return new THREE.ShaderMaterial({
      vertexShader,
      fragmentShader,
      side: backside ? THREE.BackSide : THREE.FrontSide,
      uniforms: {
        uTexture: { value: null },
        uResolution: { value: new THREE.Vector2(1, 1) },
        uIorR: { value: 1.15 }, uIorY: { value: 1.16 }, uIorG: { value: 1.18 },
        uIorC: { value: 1.22 }, uIorB: { value: 1.22 }, uIorP: { value: 1.22 },
        uRefractPower: { value: backside ? 0.22 : 0.30 },
        uChromatic: { value: 0.5 },
        uSaturation: { value: 1.08 },
        uShininess: { value: 90 },
        uDiffuseness: { value: 0.02 },
        uFresnelPower: { value: 5.0 },
        uLight: { value: new THREE.Vector3(-1, 1, 1) },
        uBackside: { value: backside ? 1 : 0 },
      },
    });
  }
  const backMat = glass(true);
  const frontMat = glass(false);

  // ---------- Geometry: a glass triangular prism with rounded edges, triangle facing the viewer ----------
  function prismGeometry() {
    const radius = 1, corner = 0.17;
    const pts = [0, 1, 2].map((i) => {
      const a = Math.PI / 2 + i * (2 * Math.PI / 3);
      return new THREE.Vector2(Math.cos(a) * radius, Math.sin(a) * radius);
    });
    const shape = new THREE.Shape();
    for (let i = 0; i < 3; i++) {
      const p = pts[i], prev = pts[(i + 2) % 3], next = pts[(i + 1) % 3];
      const a = p.clone().add(prev.clone().sub(p).normalize().multiplyScalar(corner * 1.6));
      const b = p.clone().add(next.clone().sub(p).normalize().multiplyScalar(corner * 1.6));
      if (i === 0) shape.moveTo(a.x, a.y); else shape.lineTo(a.x, a.y);
      shape.quadraticCurveTo(p.x, p.y, b.x, b.y);
    }
    shape.closePath();
    let g = new THREE.ExtrudeGeometry(shape, {
      depth: 0.85, steps: 1, curveSegments: 18,
      bevelEnabled: true, bevelThickness: 0.1, bevelSize: 0.1, bevelSegments: 8,
    });
    g.deleteAttribute('uv');
    g = BGU.mergeVertices(g, 1e-4);
    g.computeVertexNormals();
    g.computeBoundingBox();
    const box = g.boundingBox;
    const size = new THREE.Vector3(); box.getSize(size);
    const center = new THREE.Vector3(); box.getCenter(center);
    g.translate(-center.x, -center.y, -center.z);
    const s = 1 / Math.max(size.x, size.y, size.z);
    g.scale(s, s, s);
    return g;
  }

  const scene = new THREE.Scene();
  const pivot = new THREE.Group();
  const spinner = new THREE.Group();
  scene.add(pivot);
  pivot.add(spinner);
  const prism = new THREE.Mesh(prismGeometry(), frontMat);
  spinner.add(prism);
  spinner.rotation.set(-0.30, 0.55, 0.04);
  document.getElementById('loader').classList.add('done');

  // ---------- Render targets ----------
  const rtOpts = { type: THREE.HalfFloatType };
  let rtBack = new THREE.WebGLRenderTarget(1, 1, rtOpts);
  let rtFront = new THREE.WebGLRenderTarget(1, 1, rtOpts);
  backMat.uniforms.uTexture.value = rtBack.texture;
  frontMat.uniforms.uTexture.value = rtFront.texture;

  // ---------- Layout ----------
  let W = 1, H = 1, DPR = 1, mobile = false;

  function drawHeadline() {
    textCanvas.width = Math.max(1, Math.round(W * DPR));
    textCanvas.height = Math.max(1, Math.round(H * DPR));
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    let fs = Math.min(H * 0.25, W * (mobile ? 0.21 : 0.13));
    ctx.font = `700 ${fs}px 'Space Grotesk', system-ui, sans-serif`;
    const widest = Math.max(...LINES.map((l) => ctx.measureText(l).width));
    const maxW = W * (mobile ? 0.9 : 0.62);
    if (widest > maxW) {
      fs *= maxW / widest;
      ctx.font = `700 ${fs}px 'Space Grotesk', system-ui, sans-serif`;
    }
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    const cx = W * 0.5, cy = H * (mobile ? 0.47 : 0.48);
    const gap = fs * 1.02, cap = fs * 0.7;
    LINES.forEach((line, i) => ctx.fillText(line, cx, cy + cap / 2 + (i - 1) * gap));
    textTex.needsUpdate = true;
  }

  function layout() {
    W = Math.max(1, innerWidth);
    H = Math.max(1, innerHeight);
    DPR = Math.min(devicePixelRatio || 1, 2);
    mobile = W < 768 || W / H < 1;

    renderer.setPixelRatio(DPR);
    renderer.setSize(W, H, false);
    camera.aspect = W / H;
    camera.updateProjectionMatrix();

    const bw = Math.round(W * DPR), bh = Math.round(H * DPR);
    rtBack.setSize(bw, bh);
    rtFront.setSize(bw, bh);
    backMat.uniforms.uResolution.value.set(bw, bh);
    frontMat.uniforms.uResolution.value.set(bw, bh);

    drawHeadline();

    const visH = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z;
    const visW = visH * camera.aspect;
    const sx = mobile ? 0.5 : 0.53, sy = mobile ? 0.47 : 0.5;
    pivot.position.set((sx - 0.5) * visW, (0.5 - sy) * visH, 0);
    const px = Math.min(H * 0.70, W * (mobile ? 0.62 : 0.36));
    pivot.scale.setScalar((px / H) * visH);
  }

  addEventListener('resize', layout);
  if (document.fonts) document.fonts.addEventListener('loadingdone', drawHeadline);

  // ---------- Interaction: drag, inertia, idle drift, keyboard ----------
  const qTmp = new THREE.Quaternion();
  const AX_Y = new THREE.Vector3(0, 1, 0);
  const AX_X = new THREE.Vector3(1, 0, 0);
  function rotateWorld(dx, dy) {
    qTmp.setFromAxisAngle(AX_Y, dx); spinner.quaternion.premultiply(qTmp);
    qTmp.setFromAxisAngle(AX_X, dy); spinner.quaternion.premultiply(qTmp);
  }

  let dragging = false, lastX = 0, lastY = 0, lastT = 0;
  let velX = 0, velY = 0, releasedAt = performance.now() - 10000;
  let spinRemaining = 0;
  let touchMode = null; // 'rotate' | 'scroll' for touch gestures
  let startX = 0, startY = 0;
  const hint = document.getElementById('hint');

  canvas.addEventListener('pointerdown', (e) => {
    dragging = true;
    touchMode = e.pointerType === 'touch' ? null : 'rotate';
    startX = lastX = e.clientX; startY = lastY = e.clientY; lastT = performance.now();
    velX = velY = 0; spinRemaining = 0;
    canvas.setPointerCapture(e.pointerId);
    canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const now = performance.now();
    const ddx = e.clientX - lastX, ddy = e.clientY - lastY;
    if (touchMode === null) {
      // On touch, a mostly vertical swipe scrolls the page instead of rotating.
      const tx = e.clientX - startX, ty = e.clientY - startY;
      if (Math.hypot(tx, ty) < 6) return;
      touchMode = Math.abs(ty) > Math.abs(tx) * 1.4 ? 'scroll' : 'rotate';
    }
    if (touchMode === 'scroll') {
      tellParent(-ddy);
    } else {
      const dx = ddx * 0.008, dy = ddy * 0.008;
      rotateWorld(dx, dy);
      const frames = Math.max(1, (now - lastT) / 16.67);
      velX = dx / frames; velY = dy / frames;
      hint.classList.add('gone');
    }
    lastX = e.clientX; lastY = e.clientY; lastT = now;
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    if (touchMode === 'scroll') { velX = velY = 0; }
    releasedAt = performance.now();
    canvas.classList.remove('dragging');
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // Arrow keys turn the prism a third of a turn: the next face.
  canvas.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault();
      spinRemaining += (e.key === 'ArrowLeft' ? -1 : 1) * (2 * Math.PI / 3);
      velX = velY = 0;
      releasedAt = performance.now();
      hint.classList.add('gone');
    }
  });

  // ---------- Render loop ----------
  let prev = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - prev) / 1000);
    prev = now;
    const f = dt * 60;

    if (!dragging) {
      if (Math.abs(spinRemaining) > 0.0005) {
        const step = spinRemaining * Math.min(1, 0.09 * f);
        rotateWorld(step, 0);
        spinRemaining -= step;
      } else {
        spinRemaining = 0;
      }
      if (Math.abs(velX) + Math.abs(velY) > 1e-5) {
        rotateWorld(velX * f, velY * f);
        const damp = Math.pow(0.94, f);
        velX *= damp; velY *= damp;
      }
      if (!still) {
        const since = (now - releasedAt) / 1000;
        const blend = Math.min(1, Math.max(0, (since - 0.6) / 1.0));
        rotateWorld(0.004 * f * blend, 0);
      }
    }

    // 1) background only -> rtBack
    renderer.autoClear = true;
    renderer.setRenderTarget(rtBack);
    renderer.render(bgScene, camera);
    // 2) background + back faces -> rtFront
    renderer.setRenderTarget(rtFront);
    renderer.render(bgScene, camera);
    renderer.autoClear = false;
    prism.material = backMat;
    renderer.render(scene, camera);
    // 3) background + front faces -> screen
    renderer.autoClear = true;
    renderer.setRenderTarget(null);
    renderer.render(bgScene, camera);
    renderer.autoClear = false;
    renderer.clearDepth();
    prism.material = frontMat;
    renderer.render(scene, camera);
    renderer.autoClear = true;

    requestAnimationFrame(frame);
  }

  const fontsReady = document.fonts
    ? Promise.race([
        Promise.all([document.fonts.load("700 100px 'Space Grotesk'"), document.fonts.ready]),
        new Promise((r) => setTimeout(r, 2500)),
      ])
    : Promise.resolve();
  fontsReady.then(() => {
    layout();
    requestAnimationFrame(frame);
  });
}
</script>
</body>
</html>
